name: Sync Fork with Upstream

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  # Lets you trigger a sync manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Required checkout step
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main

      # Step 2: Run the upstream sync action
      - name: Upstream Sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: disposable-email-domains/disposable-email-domains
          upstream_sync_branch: main
